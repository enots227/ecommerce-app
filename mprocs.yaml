# Run with `devbox run dev` (needs the devbox env for COMPOSE_ENV_FILES).
# Docker services start automatically; apps are listed but stopped.
# Select an app and press `s` to start it, `x` to stop, `r` to restart.
procs:
  docker:
    shell: docker compose up
    cwd: <CONFIG_DIR>
    autostart: true
    # SIGINT lets compose stop the containers gracefully on quit.
    # stop: SIGINT
  ui:
    # Export the shared NEXT_PUBLIC_ECOMMERCE_CMS_API_TOKEN from the root .env.docker.
    shell: set -a && . ../.env.docker && set +a && npm run dev
    cwd: <CONFIG_DIR>/ui
    autostart: false
    env:
      PORT: "3000"
  api:
    shell: npm run dev
    cwd: <CONFIG_DIR>/api
    autostart: false
    env:
      # Nest and Next both default to 3000.
      PORT: "3001"
  cms:
    # Export the shared ECOMMERCE_CMS_DB_* settings from the root .env.docker.
    # Strapi's dotenv never overrides variables that are already set.
    shell: set -a && . ../.env.docker && set +a && npm run dev
    cwd: <CONFIG_DIR>/cms
    autostart: false
    env:
      ENV_PATH: .env.docker
